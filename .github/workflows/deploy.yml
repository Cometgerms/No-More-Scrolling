name: Build, test and deploy
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '23 10 * * *'
permissions:
  contents: read
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Fetch world headlines
        if: github.event_name != 'pull_request'
        run: node --import tsx scripts/fetch-world.mjs
      - name: Fetch archive and generate daily world analysis
        if: github.event_name != 'pull_request'
        env:
          WORLD_AI_KEY: ${{ secrets.WORLD_AI_KEY }}
          WORLD_AI_ENDPOINT: ${{ vars.WORLD_AI_ENDPOINT }}
          WORLD_AI_MODEL: ${{ vars.WORLD_AI_MODEL }}
          WORLD_ARCHIVE_URL: https://cometgerms.github.io/No-More-Scrolling/world-analysis.json
          WORLD_GENERATE: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
        run: node --import tsx scripts/generate-world.ts
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: dist
  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
